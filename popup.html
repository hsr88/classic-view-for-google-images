<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classic Rows</title>
<link rel="stylesheet" href="popup.css">
</head>
<body class="is-loading">

<header class="top">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="1.5" y="2.5" width="8" height="4.5" rx="1"/>
      <rect x="11" y="2.5" width="3.5" height="4.5" rx="1"/>
      <rect x="1.5" y="9" width="3.5" height="4.5" rx="1"/>
      <rect x="6.5" y="9" width="8" height="4.5" rx="1"/>
    </svg>
    <div>
      <h1>Classic View</h1>
      <p id="status" aria-live="polite"></p>
    </div>
  </div>
  <label class="switch">
    <input type="checkbox" id="master" role="switch" aria-label="Enable classic layout">
    <span class="track" aria-hidden="true"></span>
  </label>
</header>

<main>
  <section class="group" aria-label="Layout">
    <h2 class="group-label">Layout</h2>

    <div class="slider-row">
      <div class="slider-head">
        <label for="rowH">Row height</label>
        <output id="rowHVal" for="rowH">180 px</output>
      </div>
      <input type="range" id="rowH" min="120" max="300" step="10" value="180">
    </div>

    <div class="slider-row">
      <div class="slider-head">
        <label for="gap">Gap</label>
        <output id="gapVal" for="gap">6 px</output>
      </div>
      <input type="range" id="gap" min="0" max="20" step="1" value="6">
    </div>
  </section>

  <section class="group" aria-label="Features">
    <h2 class="group-label">Features</h2>

    <label class="feature">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"/>
        <path d="M10.5 10.5 14 14"/>
      </svg>
      <span class="row-text">Hover zoom</span>
      <span class="switch small">
        <input type="checkbox" id="zoom" role="switch" aria-label="Hover zoom">
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <label class="feature">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2.5" width="12" height="11" rx="1.5"/>
        <circle cx="5.5" cy="6.5" r="1.25"/>
        <path d="m2.5 12 3.5-3.5 2.5 2.5 3-3 2 2"/>
      </svg>
      <span class="row-text">View image button</span>
      <span class="switch small">
        <input type="checkbox" id="viewBtn" role="switch" aria-label="View image button">
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <label class="feature">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M2 5.5h12"/>
        <circle cx="9.5" cy="5.5" r="2"/>
        <path d="M2 10.5h12"/>
        <circle cx="5.5" cy="10.5" r="2"/>
      </svg>
      <span class="row-text">Size filter bar</span>
      <span class="switch small">
        <input type="checkbox" id="filters" role="switch" aria-label="Size filter bar">
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <label class="feature">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8s2.5-4.5 6-4.5 6 4.5 6 4.5-2.5 4.5-6 4.5S2 8 2 8Z"/>
        <path d="m2 2 12 12"/>
      </svg>
      <span class="row-text">Hide related searches</span>
      <span class="switch small">
        <input type="checkbox" id="hideRelated" role="switch" aria-label="Hide related searches">
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>
  </section>
</main>

<footer>
  <div class="footer-actions">
    <a class="footer-action kofi" href="https://ko-fi.com/hsr" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6.5h8.5V10a3.5 3.5 0 0 1-3.5 3.5h-1.5A3.5 3.5 0 0 1 3 10V6.5Z"/>
        <path d="M11.5 7.5h1a2 2 0 0 1 0 4h-1"/>
        <path d="M5.5 2.5v1.5M8.5 2.5v1.5"/>
      </svg>
      <span>Support</span>
    </a>
    <button class="footer-action report" id="reportIssue" type="button">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 5v3.5"/>
        <path d="M8 11.5h.01"/>
        <path d="M6.25 2.5h3.5L14 13.5H2L6.25 2.5Z"/>
      </svg>
      <span>Report issue</span>
    </button>
  </div>
  <span class="version" id="version"></span>
</footer>

<script src="popup.js"></script>
</body>
</html>
